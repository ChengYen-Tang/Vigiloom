# Single-host Temporal example. Keep these endpoints on a trusted network.
name: vigiloom-temporal-deploy
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${VIGILOOM_TEMPORAL_DB_PASSWORD:?Set the Temporal PostgreSQL password}
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${VIGILOOM_TEMPORAL_DB_PASSWORD:?Set the Temporal PostgreSQL password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${VIGILOOM_TEMPORAL_BIND:-127.0.0.1}:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  ui:
    image: temporalio/ui:2.39.0
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "${VIGILOOM_TEMPORAL_UI_BIND:-127.0.0.1}:8233:8080"

volumes:
  temporal-postgres:
