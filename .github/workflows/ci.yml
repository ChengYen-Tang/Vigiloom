name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_web:
    name: Windows Web tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-test-setup
      - name: Install Chromium
        shell: pwsh
        run: ./tests/Vigiloom.Web.Tests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Test Web project
        run: dotnet test tests/Vigiloom.Web.Tests/Vigiloom.Web.Tests.csproj --configuration Release --no-build --no-restore -m:1

  windows_remaining:
    name: Windows remaining tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-test-setup
      - name: Test remaining solution
        shell: pwsh
        run: ./tools/ci/test-without-web.ps1
      - name: Test Agent release publisher
        shell: pwsh
        run: '& $env:VIGILOOM_RELEASE_PYTHON -m unittest discover -s tools/agent-release'

  windows:
    name: Windows build and test
    if: always()
    needs: [windows_web, windows_remaining, windows_agent_service]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Windows test jobs
        shell: bash
        run: |
          test '${{ needs.windows_web.result }}' = 'success'
          test '${{ needs.windows_remaining.result }}' = 'success'
          test '${{ needs.windows_agent_service.result }}' = 'success'

  linux_agent_systemd:
    name: Linux Agent systemd integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check disposable systemd host
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(ps -p 1 -o comm=)" = systemd
          sudo -n true
      - name: Build test and real Agent packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Vigiloom.Web.Tests/Vigiloom.Web.Tests.csproj --configuration Release
          dotnet publish src/Agent/Vigiloom.Agent/Vigiloom.Agent.csproj --configuration Release --runtime linux-x64 --self-contained true --output "$RUNNER_TEMP/agent-initial" -p:Version=1.0.0
          dotnet publish src/Agent/Vigiloom.Agent/Vigiloom.Agent.csproj --configuration Release --runtime linux-x64 --self-contained true --output "$RUNNER_TEMP/agent-update" -p:Version=1.1.0
          dotnet publish src/Updater/Vigiloom.Updater/Vigiloom.Updater.csproj --configuration Release --runtime linux-x64 --self-contained true --output "$RUNNER_TEMP/updater" -p:Version=1.0.0
          dotnet publish src/Updater/Vigiloom.Updater/Vigiloom.Updater.csproj --configuration Release --runtime linux-x64 --self-contained true --output "$RUNNER_TEMP/updater-replacement" -p:Version=1.1.0
          python -m venv "$RUNNER_TEMP/agent-python"
          "$RUNNER_TEMP/agent-python/bin/python" -m pip install --require-hashes -r tools/agent-release/requirements.txt
          "$RUNNER_TEMP/agent-python/bin/python" tools/agent-release/package.py --publish-directory "$RUNNER_TEMP/agent-initial" --output-directory "$RUNNER_TEMP/agent-initial-archive" --rid linux-x64 --version 1.0.0
          "$RUNNER_TEMP/agent-python/bin/python" tools/agent-release/package.py --publish-directory "$RUNNER_TEMP/agent-update" --output-directory "$RUNNER_TEMP/agent-archive" --rid linux-x64 --version 1.1.0
          echo "VIGILOOM_SYSTEMD_INITIAL_AGENT=$RUNNER_TEMP/agent-initial" >> "$GITHUB_ENV"
          echo "VIGILOOM_SYSTEMD_UPDATER=$RUNNER_TEMP/updater" >> "$GITHUB_ENV"
          echo "VIGILOOM_SYSTEMD_REPLACEMENT_UPDATER=$RUNNER_TEMP/updater-replacement" >> "$GITHUB_ENV"
          echo "VIGILOOM_SYSTEMD_INITIAL_ARCHIVE=$RUNNER_TEMP/agent-initial-archive/agent-linux-x64.zip" >> "$GITHUB_ENV"
          echo "VIGILOOM_SYSTEMD_UPDATE_ARCHIVE=$RUNNER_TEMP/agent-archive/agent-linux-x64.zip" >> "$GITHUB_ENV"
      - name: Test Linux Agent IPC permissions
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Vigiloom.Updater.Core.Tests/Vigiloom.Updater.Core.Tests.csproj --configuration Release
          dotnet build tests/Vigiloom.Agent.Tests/Vigiloom.Agent.Tests.csproj --configuration Release
          dotnet_executable=$(command -v dotnet)
          results_dir=$(mktemp -d "$RUNNER_TEMP/vigiloom-root-tests.XXXXXX")
          trap 'sudo rm -rf -- "$results_dir"' EXIT
          mkdir "$results_dir/vstest"
          sudo -n env VIGILOOM_RUN_ROOT_IPC_TESTS=1 VSTEST_ARTIFACTS_BASE_DIRECTORY="$results_dir/vstest" TMPDIR="$results_dir/vstest" "$dotnet_executable" test tests/Vigiloom.Updater.Core.Tests/Vigiloom.Updater.Core.Tests.csproj \
            --configuration Release --no-build --no-restore --results-directory "$results_dir" --logger 'trx;LogFileName=ipc.trx' \
            --filter 'FullyQualifiedName~Vigiloom.Updater.Core.Tests.LinuxUpdateListenerTests'
          sudo -n env VIGILOOM_RUN_ROOT_IPC_TESTS=1 VIGILOOM_TEST_SOCKET_ROOT=/run VSTEST_ARTIFACTS_BASE_DIRECTORY="$results_dir/vstest" TMPDIR="$results_dir/vstest" "$dotnet_executable" test tests/Vigiloom.Agent.Tests/Vigiloom.Agent.Tests.csproj \
            --configuration Release --no-build --no-restore --results-directory "$results_dir" --logger 'trx;LogFileName=handoff.trx' \
            --filter 'FullyQualifiedName~Vigiloom.Agent.Tests.AgentUpdateWorkerTests.IncompatibleAssignmentStillRequestsResultSync|FullyQualifiedName~Vigiloom.Agent.Tests.AgentUpdateWorkerTests.StoppingWorkerCancelsPendingUpdaterResponse'
          sudo -n python3 -c 'import sys, xml.etree.ElementTree as ET; c = ET.parse(sys.argv[1]).getroot().find(".//{*}Counters"); assert c is not None and int(c.get("passed", 0)) >= 5 and int(c.get("notExecuted", 0)) == 0' "$results_dir/ipc.trx"
          sudo -n python3 -c 'import sys, xml.etree.ElementTree as ET; c = ET.parse(sys.argv[1]).getroot().find(".//{*}Counters"); assert c is not None and int(c.get("passed", 0)) >= 2 and int(c.get("notExecuted", 0)) == 0' "$results_dir/handoff.trx"
      - name: Start isolated SQL Server
        id: systemd_sql
        shell: bash
        run: |
          set -euo pipefail
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password" SQLCMDPASSWORD="$password"
          docker run -d --name vigiloom-systemd-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest > /dev/null
          for attempt in $(seq 1 90); do
            if docker exec -e SQLCMDPASSWORD vigiloom-systemd-sql /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -C -Q 'SELECT 1' > /dev/null 2>&1; then
              echo 'VIGILOOM_TEST_SQL_ALLOW_SOURCE=localhost,1433' >> "$GITHUB_ENV"
              echo "SQLCMDPASSWORD=$password" >> "$GITHUB_ENV"
              printf 'VIGILOOM_TEST_SQL_CONNECTION=Server=localhost,1433;Database=master;User ID=sa;Password=%s;Encrypt=true;TrustServerCertificate=true\n' "$password" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo 'The isolated SQL Server did not become ready.' >&2
          exit 1
      - name: Test installed Agent update and rollback
        env:
          VIGILOOM_SYSTEMD_AGENT_TEST: '1'
        shell: bash
        run: |
          set -euo pipefail
          # The hosted image permits writes to /opt; the production installer requires
          # a root-owned parent. Restore the original VM permissions on every exit.
          test -d /opt && test ! -L /opt
          opt_owner=$(stat -c '%u:%g' /opt)
          opt_mode=$(stat -c '%a' /opt)
          restore_opt() { sudo chown "$opt_owner" /opt; sudo chmod "$opt_mode" /opt; }
          trap restore_opt EXIT
          sudo chown root:root /opt
          sudo chmod go-w /opt
          dotnet test tests/Vigiloom.Web.Tests/Vigiloom.Web.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~AgentServiceUpdateTests.Linux_
      - name: Verify test database cleanup
        if: always() && steps.systemd_sql.outcome == 'success'
        shell: bash
        run: |
          docker exec -e SQLCMDPASSWORD vigiloom-systemd-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d master -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE name LIKE 'Vigiloom[_]Test[_]%') THROW 50001, 'Test database remains', 1;"
      - name: Remove isolated SQL Server
        if: always()
        run: docker rm -f vigiloom-systemd-sql > /dev/null 2>&1 || true

  windows_agent_service:
    name: Windows Agent service integration (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      VIGILOOM_WINDOWS_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-test-setup
      - name: Build real Agent packages
        shell: pwsh
        run: |
          dotnet publish src/Agent/Vigiloom.Agent/Vigiloom.Agent.csproj --configuration Release --runtime $env:VIGILOOM_WINDOWS_RID --self-contained true --output "$env:RUNNER_TEMP/agent-initial" -p:Version=1.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Initial Agent publish failed.' }
          dotnet publish src/Agent/Vigiloom.Agent/Vigiloom.Agent.csproj --configuration Release --runtime $env:VIGILOOM_WINDOWS_RID --self-contained true --output "$env:RUNNER_TEMP/agent-update" -p:Version=1.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Updated Agent publish failed.' }
          dotnet publish src/Updater/Vigiloom.Updater/Vigiloom.Updater.csproj --configuration Release --runtime $env:VIGILOOM_WINDOWS_RID --self-contained true --output "$env:RUNNER_TEMP/updater" -p:Version=1.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Updater publish failed.' }
          dotnet publish src/Updater/Vigiloom.Updater/Vigiloom.Updater.csproj --configuration Release --runtime $env:VIGILOOM_WINDOWS_RID --self-contained true --output "$env:RUNNER_TEMP/updater-replacement" -p:Version=1.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Replacement Updater publish failed.' }
          & $env:VIGILOOM_RELEASE_PYTHON tools/agent-release/package.py --publish-directory "$env:RUNNER_TEMP/agent-initial" --output-directory "$env:RUNNER_TEMP/agent-initial-archive" --rid $env:VIGILOOM_WINDOWS_RID --version 1.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Initial Agent archive failed.' }
          & $env:VIGILOOM_RELEASE_PYTHON tools/agent-release/package.py --publish-directory "$env:RUNNER_TEMP/agent-update" --output-directory "$env:RUNNER_TEMP/agent-archive" --rid $env:VIGILOOM_WINDOWS_RID --version 1.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Updated Agent archive failed.' }
          "VIGILOOM_WINDOWS_INITIAL_AGENT=$env:RUNNER_TEMP/agent-initial" >> $env:GITHUB_ENV
          "VIGILOOM_WINDOWS_UPDATER=$env:RUNNER_TEMP/updater" >> $env:GITHUB_ENV
          "VIGILOOM_WINDOWS_REPLACEMENT_UPDATER=$env:RUNNER_TEMP/updater-replacement" >> $env:GITHUB_ENV
          "VIGILOOM_WINDOWS_INITIAL_ARCHIVE=$env:RUNNER_TEMP/agent-initial-archive/agent-$($env:VIGILOOM_WINDOWS_RID).zip" >> $env:GITHUB_ENV
          "VIGILOOM_WINDOWS_UPDATE_ARCHIVE=$env:RUNNER_TEMP/agent-archive/agent-$($env:VIGILOOM_WINDOWS_RID).zip" >> $env:GITHUB_ENV
      - name: Test installed Agent update and rollback
        shell: pwsh
        env:
          VIGILOOM_WINDOWS_AGENT_TEST: '1'
        run: dotnet test tests/Vigiloom.Web.Tests/Vigiloom.Web.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~AgentServiceUpdateTests.Windows_

  ubuntu:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore Vigiloom.slnx
      - name: Build solution
        run: dotnet build Vigiloom.slnx --configuration Release --no-restore
      - name: Install Chromium and dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo apt-get -o APT::Update::Error-Mode=any update; then
            # Retry with an alternate Ubuntu mirror while preserving signing settings.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [[ -f "$source" ]]; then
                sudo sed -i -E \
                  -e 's#(^|[[:space:]])mirror\+file:/etc/apt/apt-mirrors\.txt([[:space:]]|$)#\1https://mirrors.kernel.org/ubuntu/\2#g' \
                  -e 's#(^|[[:space:]])https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?([[:space:]]|$)#\1https://mirrors.kernel.org/ubuntu/\3#g' \
                  "$source"
              fi
            done
            sudo apt-get -o APT::Update::Error-Mode=any update
          fi
          pwsh tests/Vigiloom.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start isolated SQL Server
        id: sql
        shell: bash
        run: |
          set -euo pipefail
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password"
          export SQLCMDPASSWORD="$password"
          docker run -d --name vigiloom-test-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest > /dev/null
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -C -Q 'SELECT 1' > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo 'The isolated SQL Server did not become ready.' >&2
            exit 1
          fi
          # This development-named sentinel exists only on the disposable CI server.
          docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -Q 'CREATE DATABASE [Vigiloom_Development]'
          docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d Vigiloom_Development \
            -Q 'CREATE TABLE dbo.CiSentinel (Id int NOT NULL PRIMARY KEY); INSERT INTO dbo.CiSentinel VALUES (42)'
          echo "SQLCMDPASSWORD=$password" >> "$GITHUB_ENV"
          echo 'VIGILOOM_TEST_SQL_ALLOW_SOURCE=localhost,1433' >> "$GITHUB_ENV"
          printf 'VIGILOOM_TEST_SQL_CONNECTION=Server=localhost,1433;Database=master;User ID=sa;Password=%s;Encrypt=true;TrustServerCertificate=true\n' "$password" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agent release test dependencies
        shell: pwsh
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'vigiloom-agent-python'
          python -m venv $pythonRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Python test environment.' }
          $python = if ($IsWindows) { Join-Path $pythonRoot 'Scripts/python.exe' } else { Join-Path $pythonRoot 'bin/python' }
          & $python -m pip install --require-hashes -r tools/agent-release/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install release test dependencies.' }
          "VIGILOOM_RELEASE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Test solution
        run: dotnet test Vigiloom.slnx --configuration Release --no-build --no-restore
      - name: Test Agent release publisher
        shell: pwsh
        run: '& $env:VIGILOOM_RELEASE_PYTHON -m unittest discover -s tools/agent-release'
      - name: Verify recovery requires local administrator privileges
        shell: bash
        run: |
          set +e
          output=$(dotnet run --project src/Hosts/Vigiloom.Migrator --configuration Release --no-build -- recover-admin test-account 2>&1)
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Recovery unexpectedly accepted an unprivileged account.' >&2
            exit 1
          fi
          case "$output" in
            *"Run recovery with local administrator privileges"*) ;;
            *) echo 'Recovery did not reject the unprivileged operator as expected.' >&2; exit 1 ;;
          esac
      - name: Verify development sentinel and test cleanup
        if: always() && steps.sql.outcome == 'success'
        run: |
          docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d master -Q "IF DB_ID('Vigiloom_Development') IS NULL THROW 50000, 'Development sentinel database was removed', 1; IF EXISTS (SELECT 1 FROM sys.databases WHERE name LIKE 'Vigiloom[_]Test[_]%') THROW 50001, 'Test database remains', 1; IF NOT EXISTS (SELECT 1 FROM Vigiloom_Development.dbo.CiSentinel WHERE Id = 42) THROW 50002, 'Development sentinel data was altered', 1;"
      - name: Remove isolated SQL Server
        if: always()
        run: docker rm -f vigiloom-test-sql > /dev/null 2>&1 || true

  ubuntu_required:
    name: Ubuntu build and test
    if: always()
    needs: [ubuntu, linux_agent_systemd]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Ubuntu test jobs
        shell: bash
        run: |
          test '${{ needs.ubuntu.result }}' = 'success'
          test '${{ needs.linux_agent_systemd.result }}' = 'success'
