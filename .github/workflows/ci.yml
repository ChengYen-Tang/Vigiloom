name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore Vigiloom.slnx
      - name: Build solution
        run: dotnet build Vigiloom.slnx --configuration Release --no-restore
      - name: Start LocalDB
        shell: pwsh
        run: |
          sqllocaldb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            sqllocaldb create MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the CI LocalDB instance.' }
          }
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Could not start the CI LocalDB instance.' }
      - name: Install Chromium
        shell: pwsh
        run: ./tests/Vigiloom.Web.Tests/bin/Release/net10.0/playwright.ps1 install chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agent release test dependencies
        shell: pwsh
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'vigiloom-agent-python'
          python -m venv $pythonRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Python test environment.' }
          $python = if ($IsWindows) { Join-Path $pythonRoot 'Scripts/python.exe' } else { Join-Path $pythonRoot 'bin/python' }
          & $python -m pip install --require-hashes -r tools/agent-release/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install release test dependencies.' }
          "VIGILOOM_RELEASE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Test solution
        # LocalDB is shared by test projects; limit concurrent project hosts on Windows.
        run: dotnet test Vigiloom.slnx --configuration Release --no-build --no-restore -m:1
      - name: Test Agent release publisher
        shell: pwsh
        run: '& $env:VIGILOOM_RELEASE_PYTHON -m unittest discover -s tools/agent-release'

  ubuntu:
    name: Ubuntu build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore Vigiloom.slnx
      - name: Build solution
        run: dotnet build Vigiloom.slnx --configuration Release --no-restore
      - name: Install Chromium and dependencies
        run: pwsh tests/Vigiloom.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start isolated SQL Server
        id: sql
        shell: bash
        run: |
          set -euo pipefail
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password"
          export SQLCMDPASSWORD="$password"
          docker run -d --name vigiloom-test-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest > /dev/null
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -C -Q 'SELECT 1' > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo 'The isolated SQL Server did not become ready.' >&2
            exit 1
          fi
          # This development-named sentinel exists only on the disposable CI server.
          docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -Q 'CREATE DATABASE [Vigiloom_Development]'
          docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d Vigiloom_Development \
            -Q 'CREATE TABLE dbo.CiSentinel (Id int NOT NULL PRIMARY KEY); INSERT INTO dbo.CiSentinel VALUES (42)'
          echo "SQLCMDPASSWORD=$password" >> "$GITHUB_ENV"
          echo 'VIGILOOM_TEST_SQL_ALLOW_SOURCE=localhost,1433' >> "$GITHUB_ENV"
          printf 'VIGILOOM_TEST_SQL_CONNECTION=Server=localhost,1433;Database=master;User ID=sa;Password=%s;Encrypt=true;TrustServerCertificate=true\n' "$password" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agent release test dependencies
        shell: pwsh
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'vigiloom-agent-python'
          python -m venv $pythonRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Python test environment.' }
          $python = if ($IsWindows) { Join-Path $pythonRoot 'Scripts/python.exe' } else { Join-Path $pythonRoot 'bin/python' }
          & $python -m pip install --require-hashes -r tools/agent-release/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install release test dependencies.' }
          "VIGILOOM_RELEASE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Test solution
        run: dotnet test Vigiloom.slnx --configuration Release --no-build --no-restore
      - name: Test Agent release publisher
        shell: pwsh
        run: '& $env:VIGILOOM_RELEASE_PYTHON -m unittest discover -s tools/agent-release'
      - name: Verify recovery requires local administrator privileges
        shell: bash
        run: |
          set +e
          output=$(dotnet run --project src/Hosts/Vigiloom.Migrator --configuration Release --no-build -- recover-admin test-account 2>&1)
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Recovery unexpectedly accepted an unprivileged account.' >&2
            exit 1
          fi
          case "$output" in
            *"Run recovery with local administrator privileges"*) ;;
            *) echo 'Recovery did not reject the unprivileged operator as expected.' >&2; exit 1 ;;
          esac
      - name: Verify development sentinel and test cleanup
        if: always() && steps.sql.outcome == 'success'
        run: |
          docker exec -e SQLCMDPASSWORD vigiloom-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d master -Q "IF DB_ID('Vigiloom_Development') IS NULL THROW 50000, 'Development sentinel database was removed', 1; IF EXISTS (SELECT 1 FROM sys.databases WHERE name LIKE 'Vigiloom[_]Test[_]%') THROW 50001, 'Test database remains', 1; IF NOT EXISTS (SELECT 1 FROM Vigiloom_Development.dbo.CiSentinel WHERE Id = 42) THROW 50002, 'Development sentinel data was altered', 1;"
      - name: Remove isolated SQL Server
        if: always()
        run: docker rm -f vigiloom-test-sql > /dev/null 2>&1 || true
