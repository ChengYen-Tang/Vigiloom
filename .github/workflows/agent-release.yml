name: Agent package release

on:
  push:
    branches: [release/agent]
  workflow_dispatch:
    inputs:
      version:
        description: Agent version (leave blank to use packaging/agent/release.json)
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(python3 -c 'import json; print(json.load(open("packaging/agent/release.json"))["version"])')}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid Agent version' >&2; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build Agent (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish Agent and Updater
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          $agent = Join-Path $env:RUNNER_TEMP "agent-$env:RELEASE_RID"
          $updater = Join-Path $env:RUNNER_TEMP "updater-$env:RELEASE_RID"
          $packages = Join-Path $env:RUNNER_TEMP "packages-$env:RELEASE_RID"
          dotnet publish src/Agent/Vigiloom.Agent/Vigiloom.Agent.csproj -c Release -r $env:RELEASE_RID --self-contained true -o $agent "-p:Version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Agent publish failed.' }
          dotnet publish src/Updater/Vigiloom.Updater/Vigiloom.Updater.csproj -c Release -r $env:RELEASE_RID --self-contained true -o $updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater publish failed.' }
          python tools/agent-release/package.py --publish-directory $agent --updater-directory $updater --output-directory $packages --rid $env:RELEASE_RID
          if ($LASTEXITCODE -ne 0) { throw 'Agent package creation failed.' }
          if ($IsWindows) {
            & ./packaging/agent/windows/bundle.ps1 -AgentPublish $agent -UpdaterPublish $updater -OutputDirectory $packages
          } else {
            bash ./packaging/agent/linux/bundle.sh $agent $updater $packages
            if ($LASTEXITCODE -ne 0) { throw 'Agent installer creation failed.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.rid }}
          path: ${{ runner.temp }}/packages-${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: packages
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="agent-v$RELEASE_VERSION"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
          status=$?
          set -e
          if [[ "$status" != 2 ]]; then
            echo "The release tag already exists or could not be checked." >&2
            exit 1
          fi
          flags=()
          [[ "$RELEASE_VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "agent-v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" --title "Agent $RELEASE_VERSION" --notes "Vigiloom Agent installation and update packages." packages/*
